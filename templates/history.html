<!DOCTYPE html>
<html lang="en">
<head>

    <title>MiniZAP - History</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar">
    <div class="logo"><i class="fas fa-bolt"></i> MiniZAP</div>

                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Feb 17, 2026</td>
                    <td>google.com</td>
                    <td><span class="severity-badge Low">Completed</span></td>
                    <td><a href="#" style="color: #667eea;">View</a></td>
                </tr>
                <tr>
                    <td>Feb 16, 2026</td>
                    <td>testphp.vulnweb.com</td>
                    <td><span class="severity-badge High">Issues Found</span></td>
                    <td><a href="#" style="color: #667eea;">View</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
